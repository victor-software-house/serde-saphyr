name: Fork publish

# Publishes the version on downstream to crates.io as vsh-serde-saphyr, then
# tags it and opens the GitHub Release. The version and FORK-CHANGELOG.md
# change inside the fork-tooling patch, so no Version PR runs first. A run
# starts only by hand, and the dry-run input defaults to true.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview only. Set to false to publish.
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MISE_ENV: release

concurrency:
  group: fork-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/downstream'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.11.2
          install: false
          cache: true
          cache_save: false
      - run: mise install --locked
      - uses: victor-software-house/verctl/actions/publish@ff96452d1efb4cb2657a1d70af68984bd2fab601 # v0.7.2
        with:
          dry-run: ${{ inputs.dry-run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
